name: Build A26 Sales Gateway APK

on:
  push:
    branches: [ "a26-sales-gateway-v0.1", "main" ]
    paths:
      - "A26_SalesGateway/**"
      - ".github/workflows/a26-sales-gateway-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle -p A26_SalesGateway :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp A26_SalesGateway/app/build/outputs/apk/release/app-release.apk NamiWin_A26_SalesGateway_v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NamiWin-A26-SalesGateway-v0.1
          path: NamiWin_A26_SalesGateway_v0.1.apk
          if-no-files-found: error
