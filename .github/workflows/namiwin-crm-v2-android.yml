name: NamiWin CRM v2 Android
on:
  push:
    branches: [namiwin-crm-v2]
    paths:
      - 'crm-v2/android/**'
      - 'crm-v2/web/**'
      - '.github/workflows/namiwin-crm-v2-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: crm-v2/android
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          cp crm-v2/android/app/build/outputs/apk/debug/app-debug.apk NamiWin-CRM-v2-Android.apk
          test -s NamiWin-CRM-v2-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NamiWin-CRM-v2-Android
          path: NamiWin-CRM-v2-Android.apk
          retention-days: 30
