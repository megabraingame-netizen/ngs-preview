name: NamiWin CRM Windows
on:
  push:
    branches: [namiwin-crm-v1]
    paths:
      - 'crm-windows/**'
      - '.github/workflows/namiwin-crm-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: dotnet restore crm-windows/NamiWinCRM.csproj
      - name: Build
        run: msbuild crm-windows/NamiWinCRM.csproj /p:Configuration=Release
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out
          Copy-Item crm-windows/bin/Release/net472/NamiWin-CRM-Windows-Portable.exe out/NamiWin-CRM-Windows-Portable.exe
          Set-Content -Path out/README.txt -Encoding UTF8 -Value "NamiWin CRM - Portable Windows version. No installation required. Double-click NamiWin-CRM-Windows-Portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: NamiWin-CRM-Windows-Portable
          path: out/*
