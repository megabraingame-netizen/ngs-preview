plugins { id 'com.android.application' }

android {
    namespace 'com.namiwin.salesgateway'
    compileSdk 35

    defaultConfig {
        applicationId 'com.namiwin.salesgateway'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
