<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NamiWin CRM</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fa;color:#17202a}header{background:#0f172a;color:white;padding:16px;position:sticky;top:0}h1{font-size:20px;margin:0}nav{display:flex;gap:6px;overflow:auto;margin-top:12px}nav button,.btn{border:0;border-radius:9px;padding:10px 12px}nav button{background:#1e293b;color:#cbd5e1;white-space:nowrap}.btn{background:#0f172a;color:white}.wrap{padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:10px}.kpi b{font-size:24px;display:block}.section{display:none}.section.active{display:block}input,select,textarea{width:100%;padding:11px;border:1px solid #d7dde5;border-radius:9px;margin:5px 0;background:#fff}textarea{min-height:80px}.item{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:8px}.muted{font-size:12px;color:#64748b}.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1}.stage{padding:10px;background:white;border-radius:10px;border-right:5px solid #cbd5e1;margin-bottom:7px}.stage.done{border-right-color:#0f766e}.stage.current{border-right-color:#d97706}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>NAMI WIN CRM</h1><nav><button onclick="show('dash')">داشبورد</button><button onclick="show('customers')">مشتریان</button><button onclick="show('projects')">پروژه‌ها</button><button onclick="show('followups')">پیگیری‌ها</button><button onclick="show('timeline')">تایم‌لاین</button></nav></header><div class="wrap"><section id="dash" class="section active"><div class="grid"><div class="card kpi"><span class="muted">مشتریان</span><b id="kc">0</b></div><div class="card kpi"><span class="muted">پروژه‌ها</span><b id="kp">0</b></div><div class="card kpi"><span class="muted">پیگیری باز</span><b id="kf">0</b></div><div class="card kpi"><span class="muted">ارزش پروژه‌ها</span><b id="kv">0</b><span class="muted">ریال</span></div></div></section><section id="customers" class="section"><div class="card"><h3>مشتری جدید</h3><input id="cn" placeholder="نام / شرکت"><input id="cm" placeholder="موبایل"><select id="ct"><option>مالک</option><option>سازنده</option><option>معمار</option><option>مهندس ناظر</option><option>شرکت</option><option>سایر</option></select><input id="cc" placeholder="شهر"><button class="btn" onclick="addCustomer()">ذخیره مشتری</button></div><div id="cl"></div></section><section id="projects" class="section"><div class="card"><h3>پروژه جدید</h3><input id="pn" placeholder="نام پروژه"><select id="pc"></select><select id="pt"><option>درب و پنجره آلومینیومی</option><option>کرتین‌وال</option><option>نما</option><option>بازسازی</option><option>دکوراسیون</option><option>کابینت</option><option>غرفه‌سازی</option></select><select id="ps"></select><input id="pv" type="number" placeholder="مبلغ پروژه - ریال"><input id="pa" placeholder="آدرس"><button class="btn" onclick="addProject()">ذخیره پروژه</button></div><div id="pl"></div></section><section id="followups" class="section"><div class="card"><h3>پیگیری جدید</h3><input id="fn" placeholder="موضوع"><select id="ft"></select><input id="fd" type="date"><textarea id="fno" placeholder="یادداشت"></textarea><button class="btn" onclick="addFollowup()">ذخیره پیگیری</button></div><div id="fl"></div></section><section id="timeline" class="section"><select id="tp" onchange="renderTimeline()"></select><div id="tl" style="margin-top:10px"></div></section></div><script>const S=['پیش اندازه‌گیری / لیست اندازه','صدور پیش‌فاکتور','جلسه قرارداد','کارشناسی زیرسازی','اندازه‌گیری نهایی','تولید','اندازه‌گیری شیشه','ارسال بار','حمل و توزیع طبقات','نصب','ارسال و توزیع شیشه','نصب شیشه','تحویل موقت','چسب، لاستیک و آب‌بندی','ریگلاژ و تحویل نهایی'];let d=JSON.parse(localStorage.getItem('nwcrm')||'{"c":[],"p":[],"f":[]}');const save=()=>{localStorage.setItem('nwcrm',JSON.stringify(d));render()};const id=()=>Date.now()+Math.random();const money=n=>Number(n||0).toLocaleString('fa-IR');function show(x){document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active')}function addCustomer(){if(!cn.value.trim())return alert('نام مشتری را وارد کنید');d.c.push({id:id(),n:cn.value.trim(),m:cm.value.trim(),t:ct.value,city:cc.value.trim()});cn.value=cm.value=cc.value='';save()}function addProject(){if(!d.c.length)return alert('ابتدا مشتری ثبت کنید');if(!pn.value.trim())return alert('نام پروژه را وارد کنید');d.p.push({id:id(),n:pn.value.trim(),c:Number(pc.value),t:pt.value,s:Number(ps.value),v:Number(pv.value||0),a:pa.value.trim()});pn.value=pv.value=pa.value='';save()}function addFollowup(){if(!fn.value.trim())return alert('موضوع پیگیری را وارد کنید');d.f.push({id:id(),n:fn.value.trim(),t:ft.value,date:fd.value,note:fno.value.trim(),done:false});fn.value=fno.value='';save()}function del(k,x){d[k]=d[k].filter(v=>v.id!=x);save()}function done(x){let f=d.f.find(v=>v.id==x);if(f)f.done=!f.done;save()}function cname(x){return d.c.find(v=>v.id==x)?.n||'-'}function targetName(t){let [k,x]=(t||'').split(':');return k==='c'?(d.c.find(v=>v.id==x)?.n||'-'):(d.p.find(v=>v.id==x)?.n||'-')}function render(){kc.textContent=d.c.length;kp.textContent=d.p.length;kf.textContent=d.f.filter(x=>!x.done).length;kv.textContent=money(d.p.reduce((a,b)=>a+b.v,0));cl.innerHTML=d.c.map(x=>`<div class=item><b>${x.n}</b><div class=muted>${x.m||'-'} | ${x.t} | ${x.city||'-'}</div><div class=actions><button class=btn onclick="del('c',${x.id})">حذف</button></div></div>`).join('');pc.innerHTML=d.c.map(x=>`<option value="${x.id}">${x.n}</option>`).join('');ps.innerHTML=S.map((x,i)=>`<option value=${i}>${x}</option>`).join('');pl.innerHTML=d.p.map(x=>`<div class=item><b>${x.n}</b><div class=muted>${cname(x.c)} | ${x.t}</div><div>${S[x.s]}</div><div>${money(x.v)} ریال</div><div class=actions><button class=btn onclick="del('p',${x.id})">حذف</button></div></div>`).join('');ft.innerHTML=[...d.c.map(x=>`<option value="c:${x.id}">مشتری: ${x.n}</option>`),...d.p.map(x=>`<option value="p:${x.id}">پروژه: ${x.n}</option>`)].join('');fl.innerHTML=d.f.map(x=>`<div class=item><b>${x.n}</b><div class=muted>${targetName(x.t)} | ${x.date||'-'}</div><div>${x.note||''}</div><div class=actions><button class=btn onclick="done(${x.id})">${x.done?'باز کردن':'انجام شد'}</button><button class=btn onclick="del('f',${x.id})">حذف</button></div></div>`).join('');tp.innerHTML=d.p.map(x=>`<option value="${x.id}">${x.n}</option>`).join('');renderTimeline()}function renderTimeline(){let p=d.p.find(x=>x.id==Number(tp.value));tl.innerHTML=p?S.map((x,i)=>`<div class="stage ${i<p.s?'done':i==p.s?'current':''}"><b>${i+1}. ${x}</b></div>`).join(''):'<div class=muted>پروژه‌ای ثبت نشده است</div>'}fd.value=new Date().toISOString().slice(0,10);render();</script></body></html>
